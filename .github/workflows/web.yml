name: Publiser web-utgaven (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Enhetstester
        run: npm test

      - name: Bygg for GitHub Pages (understi /liturgi-app)
        run: |
          GH_PAGES=1 npm run build
          cp build/index.html build/404.html

      - name: Last opp Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
